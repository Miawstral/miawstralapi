# Miawstral, everything included:
#
#   docker compose up -d --build
#
# - app           API + web interface on http://localhost:3000 (documentation: /docs).
#                 Timetables come from the official open data of the Réseau Mistral
#                 (GTFS, downloaded on start and refreshed), real time from its GTFS-RT feeds.
# - osrm-prepare  one-shot, first start only: downloads OpenStreetMap (Var, ~80 MB) and
#                 builds the walking graph (about a minute).
# - osrm-foot     walking paths drawn on the map (bus paths use the official shapes).

x-osrm-image: &osrm-image ghcr.io/project-osrm/osrm-backend:v26.10.0-debian

services:
  app:
    build: .
    ports:
      - "${MIAWSTRAL_PORT:-3000}:3000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      OSRM_FOOT_URL: http://osrm-foot:5000
    volumes:
      - miawstral-data:/app/data
    restart: unless-stopped

  osrm-prepare:
    build:
      context: docker/osrm
      args:
        OSRM_IMAGE: *osrm-image
    environment:
      OSM_BBOX: ${OSM_BBOX:-5.75,42.99,6.24,43.22}
    volumes:
      - osrm-data:/data
    restart: "no"

  osrm-foot:
    image: *osrm-image
    command: osrm-routed --algorithm mld --max-viaroute-size 1000 /data/foot/toulon.osrm
    volumes:
      - osrm-data:/data:ro
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

volumes:
  miawstral-data:
  osrm-data:
